[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wechat-article-reader"
version = "0.1.0"
description = "Let AI agents read WeChat Official Account (微信公众号) articles: CLI, MCP server, local HTTP API and Agent Skill."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "rudy2009" }]
keywords = ["wechat", "weixin", "公众号", "mcp", "agent", "markdown", "claude", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "markdownify>=0.14",
  "mcp>=1.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
wxread = "wechat_article_reader.cli:main"
wechat-article-reader = "wechat_article_reader.cli:main"
wechat-article-mcp = "wechat_article_reader.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_article_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits mp.weixin.qq.com over the network (run with -m live)"]
addopts = "-m 'not live'"
